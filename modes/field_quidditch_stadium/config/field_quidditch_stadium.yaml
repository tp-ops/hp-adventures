#config_version=6
# ------------------
#  Mode Description
# ------------------
# Step 1 - Shoot all three pop's once to complete the qualify group shot and lit accural shots (quiddich stadium and left orbit shot).
# Step 2 - Make x quidditch stadium shots (pop bumper shots) and one left orbit shot to complete the accural shot.

# Step X - When a ball drains when Spells Light is unlit - Persist counter state_value.
# Step X - When a ball drains when Spells Light is lit - Persist Spells Light shot_state to lit.
# Step X - When a ball drains when Spells Light is active - Reset both Light shots to unlit, reset counter, reset timer and
#          advance state_machine to next level without a bonus.

mode:           
  start_events: start_mode_field_quidditch_stadium
  stop_events: stop_mode_field_quidditch_stadium
  priority: 300

# Used accruals instead of shot_groups.
# lb_quidditch_stadium_accrual has no shots to use with a shot_group. Counter logicblock events are used therefor an accrual necessary.
# lb_quidditch_stadium_qualify_accrual is using an accrual also instead of a shot_group for simplicity and readability.
accruals:
  # Step 1 - Quidditch stadium qualify shots
  lb_quidditch_statium_qualifying_accrual:
    enable_events: mode_field_quidditch_stadium_started{device.shots.sh_quidditch_stadium.state_name == 'unlit'}
    disable_events: logicblock_lb_quidditch_statium_qualifying_accrual_complete
    persist_state: true
    events:
      - sh_pop_left_qualify_hit
      - sh_pop_right_qualify_hit
      - sh_pop_bottom_qualify_hit

  # Step 2 - Quidditch stadium shots
  lb_quidditch_stadium_accrual:
    enable_events: 
      - logicblock_lb_quidditch_statium_qualifying_accrual_complete
      - mode_field_quidditch_stadium_started{device.shots.sh_quidditch_stadium.state_name == 'lit'}
    disable_events: mode_field_quidditch_stadium_will_stop
    persist_state: true
    events:
      - logicblock_lb_pop_left_shot_counter_complete
      - logicblock_lb_pop_right_shot_counter_complete
      - logicblock_lb_pop_bottom_shot_counter_complete

  # Step 2 - Accural shot to complete
  lb_quidditch_accrual:
    enable_events: logicblock_lb_quidditch_statium_qualifying_accrual_complete
    persist_state: true
    events:
      - logicblock_lb_quidditch_stadium_accrual_complete
      - sh_quidditch_orbit_lit_hit
    reset_on_complete: true
    events_when_complete: you_are_a_quidditch_player

shots:
  # Step 1 - Qualify pop bumper shots at mode start when shot_state is qualifying.
  # Hit every pop bumper once to complete sg_quidditch_statium_qualify shot_group.
  sh_pop_left_qualify:
    enable_events: mode_field_quidditch_stadium_started{device.shots.sh_pop_left_qualify.state_name == 'qualifying'}
    disable_events: logicblock_lb_quidditch_statium_qualifying_accrual_complete
    hit_events: sh_core_pop_left_hit
    profile: sp_pops_qualify
    show_tokens:
      led: l_pop_left_inner_ring
      color_name: white
  sh_pop_right_qualify:
    enable_events: mode_field_quidditch_stadium_started{device.shots.sh_pop_right_qualify.state_name == 'qualifying'}
    disable_events: logicblock_lb_quidditch_statium_qualifying_accrual_complete
    hit_events: sh_core_pop_right_hit
    profile: sp_pops_qualify
    show_tokens:
      led: l_pop_right_inner_ring
      color_name: white
  sh_pop_bottom_qualify:
    enable_events: mode_field_quidditch_stadium_started{device.shots.sh_pop_bottom_qualify.state_name == 'qualifying'}
    disable_events: logicblock_lb_quidditch_statium_qualifying_accrual_complete
    hit_events: sh_core_pop_bottom_hit
    profile: sp_pops_qualify
    show_tokens:
      led: l_pop_bottom_inner_ring
      color_name: white

  # Step 2 - Pop bumper shots after qualified.
  # Hit every pop bumper until corresponding outer ring is complete (16 shots per pop bumper).
  # A counter is used for each pop_shot to determine which leds needs to go on which is controlled by show_player.
  # These shots have no profile since pop bumper flash when hit (inner ring leds) is also controlled by show_player.
  sh_pop_left:
    enable_events: 
      - logicblock_lb_quidditch_statium_qualifying_accrual_complete
      - mode_field_quidditch_stadium_started{device.shots.sh_quidditch_stadium.state_name == 'lit'}
    hit_events: sh_core_pop_left_hit
  sh_pop_right:
    enable_events: 
      - logicblock_lb_quidditch_statium_qualifying_accrual_complete
      - mode_field_quidditch_stadium_started{device.shots.sh_quidditch_stadium.state_name == 'lit'}
    hit_events: sh_core_pop_right_hit
  sh_pop_bottom:
    enable_events: 
      - logicblock_lb_quidditch_statium_qualifying_accrual_complete
      - mode_field_quidditch_stadium_started{device.shots.sh_quidditch_stadium.state_name == 'lit'}
    hit_events: sh_core_pop_bottom_hit
  
  # Step 2 - Quidditch statum led
  # This shot is used to controle quidditch_statum shot led.
  # Shot group for all three pop counters, when completed this shot is advanced
  sh_quidditch_stadium:
    enable_events: 
      - logicblock_lb_quidditch_statium_qualifying_accrual_complete
      - mode_field_quidditch_stadium_started{device.shots.sh_quidditch_stadium.state_name == 'lit'}
    disable_events: mode_field_quidditch_stadium_will_stop
    profile: sp_quidditch_stadium
    advance_events:
      - logicblock_lb_quidditch_statium_qualifying_accrual_complete
      - sg_quidditch_statium_complete{device.shots.sh_quidditch_stadium.state_name == 'lit'}
    show_tokens:
      led: l_ws2812_shot_quidditch
      color_name: yellow

  # Step 2 - One left orbit shot
  sh_quidditch_orbit:
    enable_events: logicblock_lb_quidditch_statium_qualifying_accrual_complete
    disable_events: mode_field_quidditch_stadium_will_stop
    profile: sp_quidditch_orbit
    advance_events: logicblock_lb_quidditch_statium_qualifying_accrual_complete{device.shots.sh_quidditch_orbit.state_name == 'unlit'}
    hit_events: 
      # Events from env_orbit and env_orbit_alternative modes
      - sq_shot_orbit_big_left_hit
      - sq_shot_orbit_big_left_alt_hit
    show_tokens:
      led: l_ws2812_shot_forrest
      color_name: yellow

shot_profiles:
  # Control inner ring leds for pop_qualify shots when qualifying at mode start
  sp_pops_qualify:
    states:
      - name: qualifying
        show: flash_normal
        sync_ms: 500
      - name: qualified
        show: light_on
        sync_ms: 500
  # Control Quidditch Stadium led      
  sp_quidditch_stadium:
    advance_on_hit: false
    states:
      - name: unlit
        show: light_off
        sync_ms: 500
      - name: lit
        show: flash_normal
        sync_ms: 500
  sp_quidditch_orbit:
    advance_on_hit: true
    states:
      - name: unlit
        show: light_off
        sync_ms: 500
      - name: lit
        show: flash_normal
        sync_ms: 500
      - name: hit
        show: light_off
        sync_ms: 500

counters:
  # Step 2 - Make 16 pop bumper shots to complete led outer ring per pop bumper.
  # A counter for each pop_shot after qualified.
  # Each pop bumper has a 16 led outer ring.
  # At every count the corresponding led(s) will go on controlled by show_player.
  lb_pop_left_shot_counter:
    enable_events: 
      - logicblock_lb_quidditch_statium_qualifying_accrual_complete
      - mode_field_quidditch_stadium_started{device.shots.sh_quidditch_stadium.state_name == 'lit'}
    disable_events: mode_field_quidditch_stadium_will_stop
    count_events: sh_pop_left_hit
    # 16 leds outer ring thus 16 counts, started at 0 when enabled.
    count_complete_value: 16
    start_enabled: false
    disable_on_complete: true
    persist_state: true
  lb_pop_right_shot_counter:
    enable_events: 
      - logicblock_lb_quidditch_statium_qualifying_accrual_complete
      - mode_field_quidditch_stadium_started{device.shots.sh_quidditch_stadium.state_name == 'lit'}
    disable_events: mode_field_quidditch_stadium_will_stop
    count_events: sh_pop_right_hit
    # 16 leds outer ring thus 16 counts, started at 0 when enabled.
    count_complete_value: 16
    start_enabled: false
    disable_on_complete: true
    persist_state: true
  lb_pop_bottom_shot_counter:
    enable_events: 
      - logicblock_lb_quidditch_statium_qualifying_accrual_complete
      - mode_field_quidditch_stadium_started{device.shots.sh_quidditch_stadium.state_name == 'lit'}
    disable_events: mode_field_quidditch_stadium_will_stop
    count_events: sh_pop_bottom_hit
    # 16 leds outer ring thus 16 counts, started at 0 when enabled.
    count_complete_value: 16
    start_enabled: false
    disable_on_complete: true
    persist_state: true

show_player:
  # Inner ring flash when pop_shot is hit after qualified
  sh_pop_left_hit: 
    flash_normal:
      key: pop_left_flash
      action: play
      loops: 0
      show_tokens:
        led: l_pop_left_inner_ring
        color_name: white
  sh_pop_right_hit: 
    flash_normal:
      key: pop_right_flash
      action: play
      loops: 0
      show_tokens:
        led: l_pop_right_inner_ring
