#config_version=6
mode:
  start_events: start_mode_env_house_theme_selection
  stop_events: stop_mode_env_house_theme_selection
  code: mpf.modes.carousel.code.carousel.Carousel
  priority: 30

mode_settings:
  selectable_items: gryffindor, hufflepuff, ravenclaw, slytherin
  select_item_events: s_start_button_active
  next_item_events: s_fl_right_a_active
  previous_item_events: s_fl_left_a_active

variable_player:
  carousel_item_highlighted{carousel=="env_house_theme_selection" and item=="gryffindor"}:
    # using for displaying
    house_theme_title:
      action: set
      string: Gryffindor
    # using for internal code
    house_theme_name:
      action: set
      string: gryffindor
    house_theme_logo:
      action: set
      string: logo_gryffindor
    house_theme_led:
      action: set
      string: gryffindor_led
  carousel_item_highlighted{carousel=="env_house_theme_selection" and item=="hufflepuff"}:
    # using for displaying
    house_theme_title:
      action: set
      string: Hufflepuff
    # using for internal code
    house_theme_name:
      action: set
      string: hufflepuff
    house_theme_logo:
      action: set
      string: logo_hufflepuff
    house_theme_led:
      action: set
      string: hufflepuff_led
  carousel_item_highlighted{carousel=="env_house_theme_selection" and item=="ravenclaw"}:
    # using for displaying
    house_theme_title:
      action: set
      string: Ravenclaw
    # using for internal code
    house_theme_name:
      action: set
      string: ravenclaw
    house_theme_logo:
      action: set
      string: logo_ravenclaw
    house_theme_led:
      action: set
      string: ravenclaw_led
  carousel_item_highlighted{carousel=="env_house_theme_selection" and item=="slytherin"}:
    # using for displaying
    house_theme_title:
      action: set
      string: Slytherin
    # using for internal code
    house_theme_name:
      action: set
      string: slytherin
    house_theme_logo:
      action: set
      string: logo_slytherin
    house_theme_led:
      action: set
      string: slytherin_led

event_player:
  carousel_item_selected.1: stop_mode_env_house_theme_selection


slide_player:
  mode_env_house_theme_selection_started: house_theme_selection
  carousel_item_selected.2:
    house_theme_selection:
      action: remove

show_player:
  slide_sl_theme_gryffindor_active:
    theme_show:
      action: play
      key: theme_show
      loops: -1
      sync_ms: 500
      show_tokens:
        leds: theme_lights
        color_name: (current_player.house_theme_led)
  slide_sl_theme_hufflepuff_active:
    theme_show:
      action: play
      key: theme_show
      loops: -1
      sync_ms: 500
      show_tokens:
        leds: theme_lights
        color_name: (current_player.house_theme_led)
  slide_sl_theme_ravenclaw_active:
    theme_show:
      action: play
      key: theme_show
      loops: -1
      sync_ms: 500
      show_tokens:
        leds: theme_lights
        color_name: (current_player.house_theme_led)
  slide_sl_theme_slytherin_active:
    theme_show:
      action: play
      key: theme_show
      loops: -1
      sync_ms: 500
      show_tokens:
        leds: theme_lights
        color_name: (current_player.house_theme_led)

shows:
  theme_show:
    - duration: 0.25
      lights:
        (leds):
          color: (color_name)
          fade: 0.25
    - duration: 0.25
      lights:
        (leds):
          color: off


