event_player:
  # Switch start button back to allow adding players again
  s_start_button_active:
    - sw_add_player
  mode_base_started:
    - flippers_on
    - start_mode_global
    - start_mode_env_subway
    # Using a event with variable here to sent a start_theme_[house_theme_name] event, this is not working whithin slide_player itself.
    - start_theme_(current_player.house_theme_name)
  mode_base_will_stop:
    - stop_mode_global
    - stop_mode_env_subway
  mode_type_wizard_started:
    - stop_mode_global
  mode_type_wizard_stopped{not mode["base"].stopping}:
    - start_mode_global

variable_player:
  # Create a new variable 'last_score' to show this on a slide to show the last score scored.
  # So when a player scores some points, the 'change' value from 'score' will be set to this variable.
  player_score.2:
    last_score:
      int: 0
      action: set
  player_score.1:
    last_score: 
      int: (change)
      action: set
  s_tar_platform_active:
    score: 1000
  test_score:
    score: 100

widget_player:
  player_score: 
    last_score_widget:
      action: play
      expire: 0.7s

slide_player:
  # Use the events send from house_theme_name variable in the event_player to start appropriate theme.
  mode_base_started: 
    base:
      priority: 101
  start_theme_gryffindor: theme_gryffindor
  start_theme_hufflepuff: theme_hufflepuff
  start_theme_ravenclaw: theme_ravenclaw
  start_theme_slytherin: theme_slytherin

