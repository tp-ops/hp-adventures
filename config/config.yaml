#config_version=6
config:
  - config_assets.yaml
  - config_credits.yaml
  - config_mechanisms.yaml
  - config_settings.yaml
  # - config_sound.yaml
  - hardware_opp_coils.yaml
  - hardware_opp_lights_neo0.yaml
  - hardware_opp_lights_neo1.yaml
  - hardware_servos.yaml
  - hardware_switches.yaml
  - hardware_rpi.yaml

hardware:
  platform: opp, rpi, virtual
  # OPP board revision
  driverboards: gen2
  lights: opp

opp:
  ports: /dev/ttyOPP-0, /dev/ttyOPP-1, /dev/ttyOPP-2, /dev/ttyOPP-3, /dev/ttyOPP-4
  chains:
    0: /dev/ttyOPP-0
    1: /dev/ttyOPP-1
    2: /dev/ttyOPP-2
    3: /dev/ttyOPP-3
    4: /dev/ttyOPP-4
  debug: true
    
virtual_platform_start_active_switches:
  - s_trough_1
  - s_trough_2
  - s_trough_3
  - s_trough_4
  - s_trough_5

machine:
  balls_installed: 5
  min_balls: 5

game:
  balls_per_game: settings.balls_per_game
  max_players: 4
  add_player_switch_tag: add_player
  
named_colors:
  # Original colors for the four houses
  gryffindor_red: [127, 9, 9]         # 7F0909
  gryffindor_gold: [255, 197, 0]      # FFC500
  hufflepuff_yellow: [238, 225, 23]   # EEE117 
  hufflepuff_black: [0, 0, 0]         # 000000
  ravenclaw_blue: [0, 10, 144]        # 000A90
  ravenclaw_bronze: [148, 107, 45]    # 946B2D
  slytherin_green: [13, 98, 23]       # 0D6217
  slytherin_silver: [170, 170, 170]   # AAAAAA
  # Custom colors used
  flames: [232, 84, 18]
  score_text_default: [255, 255, 255] # White  
  gryffindor_led: [255, 0, 0]         # Red
  hufflepuff_led: [255, 255, 0]       # Yellow 
  ravenclaw_led: [0, 0, 255]          # Blue
  slytherin_led: [0, 153, 76]         # Green

